[package]
name = "shiro-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Lqm1/shiro-rs"
rust-version = "1.94"


[dependencies]
ciglet-rs = { version = "0.1.0", path = "../../../ciglet-rs/crates/ciglet-rs" }
clap = { version = "4.6.7", features = ["derive", "error-context", "help", "std", "suggestions", "usage"], default-features = false }
liblrhsmm-rs = { version = "0.1.0", path = "../../../liblrhsmm-rs/crates/liblrhsmm-rs" }
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
