<!doctype html>
<meta charset="utf-8">
<title>SHIRO WebAssembly loading verification</title>
<h1>SHIRO WebAssembly loading verification</h1>
<pre id="result">Running</pre>
<script type="module">
import init, * as api from '/bindings/shiro_rs.js';
import {verifyLoading} from './wasm_loading_checks.mjs';
import {verifyInitialization} from './wasm_initialization_checks.mjs';
import {verifyIsolation} from './wasm_isolation_checks.mjs';
import {verifyData} from './wasm_data_checks.mjs';
import {verifyModels} from './wasm_models_checks.mjs';
import {verifyPhones} from './wasm_phones_checks.mjs';
import {verifyInterchange} from './wasm_interchange_checks.mjs';
try {
    await init();
    const load = async name => {
        const response = await fetch('./fixtures/' + name);
        if (!response.ok) throw new Error('Fixture fetch failed: ' + name);
        return new Uint8Array(await response.arrayBuffer());
    };
    const checks = [['loading', verifyLoading], ['initialization', verifyInitialization], ['isolation', verifyIsolation], ['data', verifyData], ['models', verifyModels], ['phones', verifyPhones], ['interchange', verifyInterchange]], results = {};
    for (const [name, verify] of checks) results[name] = await verify(api, load);
    for (const [name, verify] of [...checks].reverse()) if (JSON.stringify(await verify(api, load)) !== JSON.stringify(results[name])) throw new Error('Repeated verification changed: ' + name);
    document.querySelector('#result').textContent = 'PASS ' + JSON.stringify({passes: 2, results});
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL ' + (error.stack || error);
}
</script>
